name: ChatGPT ES2008 State Time ATR
on:
  push:
    branches: [chatgpt-es2008-research]
permissions:
  contents: write
jobs:
  state_time_atr:
    if: contains(github.event.head_commit.message, 'Run ChatGPT state time ATR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-es2008-research
          fetch-depth: 0
      - name: Extract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p extracted
          7z x ES2008.zip -oextracted -y
      - name: Install
        run: python -m pip install --quiet pandas numpy
      - name: Run
        env:
          ES2008_PATH: extracted/ES2008.txt
        run: python research/state_time_atr/analysis.py
      - name: Commit
        run: |
          git config user.name "ChatGPT Research"
          git config user.email "actions@users.noreply.github.com"
          git add research/state_time_atr/out
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "ES2008 state time ATR results"
            git push origin HEAD:chatgpt-es2008-research
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: es2008-state-time-atr
          path: research/state_time_atr/out/**
          retention-days: 7
