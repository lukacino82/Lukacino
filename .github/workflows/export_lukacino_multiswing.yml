name: Export LukacinoMultiswing CSV
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: contains(github.event.head_commit.message, 'Trigger Multiswing export')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: lukacino-multiswing-live
          path: live/LukacinoMultiswing/LukacinoMultiswing_trades.csv
          retention-days: 1
