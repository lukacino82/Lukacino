name: ChatGPT ES2008 Hourly Inverse RRR FAST
on:
  push:
    branches: [chatgpt-es2008-research]
permissions:
  contents: write
jobs:
  research_fast:
    if: contains(github.event.head_commit.message, 'Run ChatGPT hourly inverse RRR FAST')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-es2008-research
          fetch-depth: 0
      - name: Extract ES2008
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p extracted
          7z x ES2008.zip -oextracted -y
      - name: Install
        run: python -m pip install --quiet pandas numpy matplotlib
      - name: Run
        env:
          ES2008_PATH: extracted/ES2008.txt
          MPLBACKEND: Agg
        run: python research/hourly_inverse_rrr_fast/analysis_fast.py
      - name: Commit outputs
        run: |
          git config user.name "ChatGPT Research"
          git config user.email "actions@users.noreply.github.com"
          git add research/hourly_inverse_rrr_fast/out
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ES2008 hourly inverse RRR FAST results"
            git push origin HEAD:chatgpt-es2008-research
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: es2008-hourly-inverse-rrr-fast-results
          path: research/hourly_inverse_rrr_fast/out/**
          retention-days: 7
