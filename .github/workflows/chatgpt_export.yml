name: Export extracted inputs
on:
  push:
    branches: [chatgpt-es-load]
permissions:
  contents: read
jobs:
  export:
    if: contains(github.event.head_commit.message, 'Trigger binary export')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p out
          7z x "es mini data new 2 (2).zip" -oout -y
          7z x "ES3000.zip" -oout -y
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: es-inputs-extracted
          path: |
            out/es mini data new 2 (2).xlsx
            out/ES3000.txt
          retention-days: 1
