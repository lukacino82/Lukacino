name: Export LukacinoMS Live CSV
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: contains(github.event.head_commit.message, 'Trigger LukacinoMS export')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: lukacino-ms-live
          path: live/LukacinoMS/LukacinoMS_trades.csv
          retention-days: 1
