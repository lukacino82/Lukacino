name: ChatGPT ES2008 Hourly Inverse RRR Research
on:
  push:
    branches: [chatgpt-es2008-research]
permissions:
  contents: write
jobs:
  research:
    if: contains(github.event.head_commit.message, 'Run ChatGPT hourly inverse RRR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-es2008-research
          fetch-depth: 0
      - name: Extract ES2008 multipart archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p extracted
          7z x ES2008.zip -oextracted -y
          find extracted -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Python dependencies
        run: python -m pip install --quiet pandas numpy matplotlib
      - name: Run research
        env:
          ES2008_PATH: extracted/ES2008.txt
          MPLBACKEND: Agg
        run: python research/hourly_inverse_rrr/analysis.py
      - name: Commit research outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Research"
          git config user.email "actions@users.noreply.github.com"
          git add research/hourly_inverse_rrr/out
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ES2008 hourly inverse RRR research results"
            git push origin HEAD:chatgpt-es2008-research
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: es2008-hourly-inverse-rrr-results
          path: research/hourly_inverse_rrr/out/**
          retention-days: 7
